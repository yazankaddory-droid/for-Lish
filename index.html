<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy birthday, Lish</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌼%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;800&family=Kalam&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="stage">
  <svg class="sun" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><circle cx="32" cy="32" r="11" fill="#f6c945"/><path d="M32 6v8M32 50v8M6 32h8M50 32h8M13.6 13.6l5.6 5.6M44.8 44.8l5.6 5.6M13.6 50.4l5.6-5.6M44.8 19.2l5.6-5.6" stroke="#f6c945" stroke-width="4" stroke-linecap="round"/></svg>

  <div class="intro">
    <h1>Happy birthday, Lish.</h1>
    <p class="sub">There’s a video inside, with a letter beside it.</p>
  </div>

  <button class="env" id="open" aria-label="Open your birthday video and letter">
    <span class="seal" aria-hidden="true">L</span>
    <span class="to">For Lish</span>
    <span class="hint">Open it</span>
  </button>
</main>

<dialog id="viewer" aria-label="Birthday video and letter">
  <button class="x" id="close" aria-label="Close">×</button>
  <div class="wrap">
    <div class="vid">
      <div class="frame"><iframe id="v" title="Birthday video" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
      <a class="dl" id="dl" target="_blank" rel="noopener">Video not playing? Download it</a>
    </div>
    <article class="letter" id="letter"></article>
  </div>
</dialog>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
